# Production-запуск: код берётся из образа, исходники не монтируются.
#   docker compose up -d --build
#
# Режим разработки (монтирование кода + автоперезапуск):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Инициализация БД (один раз при первом запуске):
#   docker compose exec app node db/init.js
#   docker compose exec app node db/seed.js
services:
  app:
    build:
      context: .
    image: tur-project:latest
    container_name: tur-project-app
    ports:
      # Снаружи порт можно поменять через APP_PORT, внутри всегда 3000
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_URL=postgres://tur:${POSTGRES_PASSWORD:-tur_pass}@db:5432/tur_project
      - SESSION_SECRET=${SESSION_SECRET:-tur-project-secret-change-in-production}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # healthcheck наследуется из Dockerfile и проверяет /healthz
    # Именованный том для загружаемых клиентами файлов (фото, сканы паспортов).
    # Содержимое не попадает в образ (dockerignore) и не в git (gitignore),
    # но persist-ится между перезапусками контейнера.
    volumes:
      - uploads_data:/app/uploads

  db:
    image: postgres:16-alpine
    container_name: tur-project-db
    environment:
      - POSTGRES_USER=tur
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tur_pass}
      - POSTGRES_DB=tur_project
    volumes:
      # Данные переживают удаление контейнера: docker compose down их НЕ трогает.
      # Полная очистка БД: docker compose down -v
      - pgdata:/var/lib/postgresql/data
    # Порт БД наружу здесь НЕ пробрасывается: в production приложение
    # достучится до db по внутреннему имени сервиса, а открывать 5432 на
    # хосте — только подставлять базу под перебор паролей. Для отладки
    # (DBeaver/pgAdmin с машины) проброс есть в docker-compose.dev.yml.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tur -d tur_project"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  # Загрузки клиентов (фото и сканы паспортов).
  # docker compose down его НЕ трогает; полная очистка — docker compose down -v
  uploads_data:
