# Оверрайд для разработки. Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Отличия от production:
#   - исходники монтируются в контейнер, поэтому правки видны сразу;
#   - команда npm run dev включает node --watch (перезапуск при изменении server.js);
#   - node_modules из образа сохраняется в отдельном томе и не затирается хостом.
services:
  app:
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
      # В dev загрузки держим в отдельном именованном томе, а не в bind mount:
      # том монтируется поверх .:/app, поэтому реальные файлы клиентов
      # не разбрасываются по рабочей копии репозитория на хосте.
      - uploads_data:/app/uploads
    command: npm run dev

  db:
    # В dev-режиме порт БД доступен с хоста для отладки (DBeaver, pgAdmin).
    # В production-файле этого проброса нет — см. комментарий в docker-compose.yml.
    ports:
      - "${DB_PORT:-5432}:5432"

# Том объявлен и здесь, и в docker-compose.yml: compose объединяет
# конфигурации обоих файлов, а при запуске только dev-файла том всё равно
# должен существовать.
volumes:
  uploads_data:

